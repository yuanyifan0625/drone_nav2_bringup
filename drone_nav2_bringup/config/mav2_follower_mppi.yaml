follower_mppi_controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    controller_plugins: [FollowPath]
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.30
      stateful: false
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Omni
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      vx_max: 0.6
      vx_min: -0.3
      vy_max: 0.6
      vy_min: -0.6
      wz_max: 0.8
      ax_max: 0.8
      ay_max: 0.8
      az_max: 1.0
      critics: [ConstraintCritic, ObstaclesCritic, GoalCritic, PathAlignCritic, PathFollowCritic]
      ObstaclesCritic:
        repulsion_weight: 0.4
      PathAlignCritic:
        use_path_orientations: true
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: MAV2/base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 10.0
      always_send_full_costmap: true
      robot_radius: 0.4
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: depth_points cooperative_obstacles
        depth_points:
          topic: /MAV2/depth/points
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_max_range: 2.0
        cooperative_obstacles:
          topic: /MAV2/cooperative_obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_max_range: 2.4
          raytrace_max_range: 2.5
          observation_persistence: 0.3
          expected_update_rate: 0.1
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.9
        cost_scaling_factor: 3.0
